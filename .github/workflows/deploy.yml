name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::129482870088
          aws-region: us-east-2

      - name: Upload site to S3
        run: aws s3 sync . s3://nvcwildcats.com --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore"