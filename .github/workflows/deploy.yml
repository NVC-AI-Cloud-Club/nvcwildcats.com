name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log('sub: ' + payload.sub);

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::129482870088:role/github-deploy-nvcwildcats
          aws-region: us-east-2

      - name: Upload site to S3
        run: aws s3 sync . s3://nvcwildcats.com --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore"
